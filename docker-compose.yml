# Vaulto Docker Compose Configuration
# For local development and testing before AWS deployment

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: vaulto-db
    environment:
      POSTGRES_USER: vaulto
      POSTGRES_PASSWORD: vaulto_dev_password
      POSTGRES_DB: vaulto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaulto"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vaulto Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaulto-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vaulto:vaulto_dev_password@db:5432/vaulto
      JWT_SECRET: your-secret-key-change-in-production
      # Add other environment variables as needed
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # MinIO (S3-compatible storage for local development)
  minio:
    image: minio/minio:latest
    container_name: vaulto-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:
